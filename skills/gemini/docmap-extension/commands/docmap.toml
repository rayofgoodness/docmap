description = "Generate/refresh .docmap/ module documentation for this project"
prompt = """
This project uses the `docmap` CLI to keep `.docmap/` module documentation
in sync with source. All discovery and file-writing logic lives in the CLI:

1. Run `npx docmap scan` to preview modules and relations (no AI calls).
2. Run `npx docmap generate --runner gemini` to generate/refresh docs,
   optionally with `--module <id>` for a single module or `--force` to
   bypass the fingerprint cache.
3. Review the `.docmap/` output and summarize what changed. Do not
   hand-edit `.docmap/` files directly — re-run `docmap generate` instead.
"""
